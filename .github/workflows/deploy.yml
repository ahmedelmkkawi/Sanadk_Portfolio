name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to portfolio.sanadk.org
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pin the VPS host key rather than blindly trusting on first use.
          echo '186.241.21.20 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfaj41kvSoP7yh3HY1czL59uPZ2V5k5OgsMWFgv/DAG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes root@186.241.21.20 \
            bash /opt/sanadk-portfolio/deploy.sh
